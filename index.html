---
layout: default
---
<p>Sometimes I write here</p>

<ul class="blog-posts">
  {% for post in site.posts limit: 5 %}
  <li>
    <span><i><time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%d %b, %Y" }}</time></i></span>
    <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
  </li>
  {% endfor %}
</ul>
